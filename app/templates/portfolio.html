{% extends "base.html" %}

{% block header_title %}Minha Carteira{% endblock %}

{% block content %}
<!-- Tech Container -->
<div class="space-y-6">

    <!-- Actions Bar -->
    <div class="flex justify-end">
        <button onclick="openModal('BUY')"
            class="group relative inline-flex items-center gap-2 px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_25px_rgba(37,99,235,0.5)] overflow-hidden">
            <div
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700">
            </div>
            <svg class="w-5 h-5 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
                </path>
            </svg>
            <span class="relative z-10">Registrar Movimentação</span>
        </button>
    </div>

    <!-- Empty State -->
    <div id="empty-state"
        class="hidden bg-[#0f172a] rounded-2xl border border-slate-800 p-12 text-center relative overflow-hidden group">
        <div class="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-10 transition-opacity duration-500">
        </div>
        <div
            class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-slate-800/50 mb-6 border border-slate-700 ring-1 ring-blue-500/20 group-hover:ring-blue-500/50 transition-all">
            <svg class="w-10 h-10 text-slate-400 group-hover:text-blue-400 transition-colors" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
                </path>
            </svg>
        </div>
        <h3 class="text-xl font-bold text-white mb-2">Sua carteira está vazia</h3>
        <p class="text-slate-400 mb-8 max-w-md mx-auto">Conecte sua conta ou registre sua primeira operação manualmente.
        </p>
        <button onclick="openModal('BUY')"
            class="text-blue-400 hover:text-white font-medium hover:underline underline-offset-4 transition-colors">
            Registrar primeira compra &rarr;
        </button>
    </div>

    <!-- Portfolio Table -->
    <div id="portfolio-content"
        class="hidden bg-[#0f172a] rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead
                    class="bg-slate-900/80 border-b border-slate-800 text-xs text-slate-500 uppercase font-medium tracking-wider">
                    <tr>
                        <th class="px-6 py-4 text-left">Ativo</th>
                        <th class="px-6 py-4 text-center">Qtde</th>
                        <th class="px-6 py-4 text-right">Preço Médio</th>
                        <th class="px-6 py-4 text-right">Preço Atual</th>
                        <th class="px-6 py-4 text-right">Saldo Total</th>
                        <th class="px-6 py-4 text-right">Rentabilidade</th>
                        <th class="px-6 py-4 text-center">Recomendação</th>
                        <th class="px-6 py-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="portfolio-table-body" class="divide-y divide-slate-800/50 bg-slate-900/20">
                    <!-- Javascript will populate -->
                </tbody>
            </table>
        </div>
    </div>
</div>


<script>
    // Formatters
    const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtPct = new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 2 });

    async function loadPortfolio() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
            return;
        }

        try {
            const response = await fetch('/api/v1/portfolio/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const items = await response.json();

            if (items.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('portfolio-content').classList.add('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('portfolio-content').classList.remove('hidden');

                const tbody = document.getElementById('portfolio-table-body');
                tbody.innerHTML = '';

                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/50 transition-colors group border-b border-slate-800/50';

                    const rentClass = item.rentability_val >= 0 ? 'text-emerald-400' : 'text-red-400';
                    const rentBg = item.rentability_val >= 0 ? 'bg-emerald-500/10' : 'bg-red-500/10';
                    const rentSign = item.rentability_val >= 0 ? '+' : '';

                    tr.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-400 ring-1 ring-slate-700">
                                    ${item.ticker.substring(0, 2)}
                                </div>
                                <span class="text-white font-bold tracking-wide">${item.ticker}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-slate-300">${item.quantity}</td>
                        <td class="px-6 py-4 text-right text-slate-400 text-xs">${fmtBRL.format(item.average_price)}</td>
                        <td class="px-6 py-4 text-right text-white font-bold font-mono tracking-tight">${fmtBRL.format(item.current_price)}</td>
                        <td class="px-6 py-4 text-right font-medium text-slate-200 font-mono">${fmtBRL.format(item.total_value)}</td>
                        <td class="px-6 py-4 text-right">
                             <div class="flex flex-col items-end">
                                <span class="${rentClass} font-bold text-xs">${rentSign}${item.rentability_pct}%</span>
                                <span class="text-[10px] text-slate-500">${rentSign}${fmtBRL.format(item.rentability_val)}</span>
                             </div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            ${getRecBadge(item.recommendation)}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                <button onclick="openModal('BUY', '${item.ticker}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-emerald-500/20 text-emerald-400 hover:text-emerald-300 flex items-center justify-center transition-colors border border-slate-700 hover:border-emerald-500/50" title="Comprar">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                                <button onclick="openModal('SELL', '${item.ticker}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-red-500/20 text-red-400 hover:text-red-300 flex items-center justify-center transition-colors border border-slate-700 hover:border-red-500/50" title="Vender">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        } catch (e) {
            console.error(e);
        }
    }

    function getRecBadge(status) {
        if (status === 'Descontado') return '<span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded text-[10px] font-bold uppercase tracking-wider shadow-[0_0_10px_rgba(16,185,129,0.2)]">Descontado</span>';
        if (status === 'Bom Pagador') return '<span class="px-2 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded text-[10px] font-bold uppercase tracking-wider">Manter (Renda)</span>';
        if (status === 'Caro') return '<span class="px-2 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded text-[10px] font-bold uppercase tracking-wider">Caro</span>';
        return '<span class="px-2 py-1 bg-slate-800 text-slate-400 border border-slate-700 rounded text-[10px] font-bold uppercase tracking-wider">Manter</span>';
    }


    document.addEventListener('DOMContentLoaded', loadPortfolio);
</script>
{% endblock %}
