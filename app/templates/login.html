<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Invexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        dark: '#0b1120',
                        surface: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
    </style>
</head>

<body class="bg-[#0b1120] flex items-center justify-center h-screen selection:bg-blue-500/30 selection:text-blue-200">

    <!-- Background Glow Effects -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl translate-y-1/2">
        </div>
    </div>

    <div class="relative z-10 w-full max-w-sm p-4">
        <div class="bg-[#0f172a] rounded-2xl shadow-xl border border-slate-800 p-6 relative overflow-hidden group">
            <!-- Border Glow -->
            <div
                class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-emerald-500 opacity-0 group-hover:opacity-10 transition-opacity duration-1000 -z-10 rounded-2xl blur">
            </div>

            <div class="text-center mb-6">
                <div class="flex justify-center mb-3">
                    <div
                        class="w-10 h-10 sm:w-12 sm:h-12 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-center shadow-lg shadow-blue-500/10 transition-all duration-300">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-blue-500" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                    </div>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Invexa</h1>
                <p class="text-slate-400 mt-1 text-xs">Acesse sua carteira inteligente</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email"
                        class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Email</label>
                    <div class="relative">
                        <input type="email" id="email" name="username" required
                            class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2.5 pl-9 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-slate-600"
                            placeholder="seu@email.com">
                        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207">
                            </path>
                        </svg>
                    </div>
                </div>

                <div>
                    <label for="password"
                        class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Senha</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                            class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2.5 pl-9 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-slate-600"
                            placeholder="••••••••">
                        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-3.5 w-3.5 bg-slate-900 border-slate-700 rounded text-blue-600 focus:ring-blue-500 focus:ring-offset-slate-900">
                        <label for="remember-me" class="ml-2 block text-xs text-slate-400">Lembrar-me</label>
                    </div>

                    <div class="text-xs">
                        <a href="#" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">Esqueceu a
                            senha?</a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full group relative bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg shadow-lg shadow-blue-500/25 transition-all overflow-hidden text-sm">
                        <div
                            class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                        </div>
                        <span class="relative">Entrar</span>
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm border-t border-slate-800 pt-6">
                <span class="text-slate-500">Não tem uma conta?</span>
                <a href="/register"
                    class="font-medium text-emerald-400 hover:text-emerald-300 ml-1 transition-colors">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Entrando...</span>';

            try {
                const response = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    alert('Login falhou. Verifique suas credenciais.');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Erro ao tentar conectar.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>

</body>

</html>
