services:
  - type: web
    name: invexa-app
    runtime: docker
    plan: free # or starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invexa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false # User must provide this in dashboard
    autoDeploy: false

databases:
  - name: invexa-db
    databaseName: invexa
    user: invexa_user
    plan: free # or starter
    region: ohio # default
